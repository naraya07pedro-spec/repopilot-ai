name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: repopilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repopilot -d repopilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://repopilot:fixture-ci-only@localhost:5432/repopilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock -e ".[dev,postgres]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=json:evidence/ci-coverage.json --junitxml=evidence/ci-tests.xml
      - run: python scripts/scan_secrets.py
      - run: python -m pip_audit -r requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: evidence/ci-*
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock -e .
        working-directory: .
      - run: npm run build:public
        env:
          PUBLIC_BASE_PATH: /repopilot-ai
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build public site at domain root for Netlify
        run: npm run build:public
        env:
          PUBLIC_BASE_PATH: ""
      - name: Verify root-path public export
        run: npx playwright test --grep "public recording workflow" --reporter=line --output=test-results-root
        env:
          PUBLIC_BASE_PATH: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/test-results-root
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Build trusted worker tooling (not an isolation test)
        run: |
          docker pull python:3.12-slim
          base=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          docker build --build-arg PYTHON_BASE="$base" -f deploy/worker/Containerfile -t repopilot-worker:ci .
          docker run --rm --network none --read-only --user 65532:65532 --entrypoint /opt/tools/bin/python repopilot-worker:ci -I -c 'import pytest, ruff; print("Trusted tooling import passed; sandbox not validated")'
      - run: docker compose up -d --wait
      - run: |
          for i in $(seq 1 30); do curl --fail http://localhost:8000/health && break || sleep 2; done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:3000/
      - if: always()
        run: docker compose down

  sandbox:
    name: Disposable Linux isolation probes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Install reviewed-source runtime on disposable CI VM
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' https://storage.googleapis.com/gvisor/releases/release/latest/x86_64/gvisor.tar.bz2 -o gvisor.tar.bz2
          curl --fail --location --proto '=https' https://storage.googleapis.com/gvisor/releases/release/latest/x86_64/gvisor.tar.bz2.sha512 -o gvisor.tar.bz2.sha512
          sha512sum --check gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          runsc --version
          podman version
          podman info --format=json
      - name: Build pinned local worker image
        run: |
          podman pull docker.io/library/python:3.12-slim
          base=$(podman image inspect docker.io/library/python:3.12-slim --format '{{index .RepoDigests 0}}')
          podman build --build-arg PYTHON_BASE="$base" -f deploy/worker/Containerfile -t localhost/repopilot-worker:probe .
          image=$(podman image inspect localhost/repopilot-worker:probe --format '{{.Id}}')
          echo "REPOPILOT_LIVE_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Run actual isolated resource and cancellation probes
        run: systemd-run --user --scope --property=Delegate=yes python scripts/run_sandbox_probes.py
        env:
          REPOPILOT_SANDBOX_ACK: disposable-test-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-probe-evidence
          path: evidence/sandbox-live.xml
